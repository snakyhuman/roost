name: CI

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One version of each tool everywhere. clang-format matches what the pre-commit
# hook runs locally: two versions lay the same code out differently.
env:
  QT_VERSION: 6.12.0
  ZIG_VERSION: 0.17.1
  CLANG_FORMAT_VERSION: 23.1.3
  CLANG_TIDY_VERSION: 20.1.0

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        preset: [dev, asan-ubsan, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        # Qt Gui loads EGL, fontconfig and xkbcommon even under the offscreen
        # platform.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libgl1-mesa-dev libegl1 \
            libfontconfig1 libxkbcommon0

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Qt is linked dynamically
        run: tools/check_qt_dynamic.sh build/${{ matrix.preset }}

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: C++
        run: |
          files=$(find src tests -name '*.cpp' -o -name '*.hpp' | sort)
          clang-format --dry-run --Werror $files

      - name: QML
        # qmlformat has no check mode: format to stdout and compare.
        run: |
          failed=0
          for file in $(find src plugins -name '*.qml' 2>/dev/null | sort); do
            qmlformat "$file" | diff -u "$file" - || failed=1
          done
          exit "$failed"

  tidy:
    name: tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libgl1-mesa-dev libegl1 \
            libfontconfig1 libxkbcommon0

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install clang-tidy
        run: pipx install "clang-tidy==${CLANG_TIDY_VERSION}"

      # A build, not just a configure: the libghostty-vt headers come out of
      # zig build and the moc files out of the build as well.
      - name: Build
        run: |
          cmake --preset dev
          cmake --build --preset dev

      # tests/gates/ holds deliberate violations; the gates job owns them.
      - name: Naming and the static analyser
        run: |
          find src tests -name '*.cpp' -not -path 'tests/gates/*' | sort |
            xargs -P "$(nproc)" -n 1 clang-tidy -p build/dev --quiet --warnings-as-errors='*'

  gates:
    name: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: pipx install "clang-tidy==${CLANG_TIDY_VERSION}"

      - name: Naming gate catches a violation in each style
        run: tools/check_naming.sh
